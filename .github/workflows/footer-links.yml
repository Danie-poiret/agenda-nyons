name: Ajouter les liens du pied de page
on:
  push:
    branches: [main]
    paths:
      - site_footer.py
      - .github/workflows/footer-links.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ajouter le pied de page sur les pages existantes
        run: python site_footer.py
      - name: Publier les pages mises à jour
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Ajouter les liens de navigation au pied de toutes les pages agenda"
          git pull --rebase
          git push

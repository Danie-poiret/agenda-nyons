name: Mise a jour agenda Nyons

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  update-agenda:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Recuperer agenda et generer les pages SEO
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-terra
        run: python update_agenda.py

      - name: Nettoyer les fiches evenements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for p in Path("evenements").glob("*/index.html"):
              s = p.read_text(encoding="utf-8")

              s = re.sub(
                  r'\s*<p class="official-note">🔗\s*<a[^>]*><strong>Voir la fiche officielle de l’événement sur nyons\.com</strong></a></p>',
                  '',
                  s,
              )

              s = s.replace(
                  "Le texte de cette page est une présentation éditoriale originale construite à partir des informations publiées. Les informations pratiques peuvent évoluer.",
                  "",
              )

              p.write_text(s, encoding="utf-8")
          PY

      - name: Enregistrer les changements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add agenda.json
          git add _seo_cache.json
          git add _event_seo_cache.json
          git add _event_detail_cache.json
          git add semaines
          git add evenements
          git add sitemap.xml
          git add robots.txt

          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi

          git commit -m "Mise a jour agenda et SEO Nyons"
          git push
